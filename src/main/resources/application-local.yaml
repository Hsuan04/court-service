app:
  logging:
    sql:
      log-all-queries: true
      log-parameters: true
  booking:
    concurrency-mode: synchronized
      #   Booking concurrency strategy
      #   naive            - read-check-write, no protection (intentionally oversells)
      #   synchronized     - one JVM-wide lock; all bookings queue on the same lock
      #   jvm-lock         - one ReentrantLock per session; only same-session bookings queue
      #   pessimistic-lock - SELECT ... FOR UPDATE on the session row
      #   optimistic-lock  - @Version check, retried in a new transaction
      #   atomic-update    - single conditional UPDATE (booked_count < capacity)
      #   redis-cache      - Redis DECR pre-deducts seats, then writes to DB
      #   redis-lua        - Lua script atomically checks and deducts in Redis
    optimistic-retry:  # Used only by optimistic-lock: after a version conflict, wait a random time in
      max-attempts: 5
      min-backoff: 1s
      max-backoff: 5s
    sold-out-cache:  # Fast reject: remember per session, on this instance only, that it is full
      enabled: true
      ttl: 5s  # How long a sold-out flag lives; longer rejects more requests early but may wrongly reject after a seat is freed
      maximum-size: 10000

logging:
  structured:
    format:
      console: ""
      file: ""
  pattern:
    console: "[%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}] [%5p] [traceId=%X{traceId:-}] [%t] %logger{40} : %m%n%wEx"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [traceId=%X{traceId:-}] [%t] %logger{40} : %m%n%wEx"
  level:
    com.courtservice: DEBUG
  file:
    name: ${LOG_PATH:/Users/lawrencecheng/Desktop/CourtService/log}/court-service.log
  logback:
    rollingpolicy:
      file-name-pattern: ${LOG_PATH:/Users/lawrencecheng/Desktop/CourtService/log}/court-service-%d{yyyy-MM-dd}.%i.log


