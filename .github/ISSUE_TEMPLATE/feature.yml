name: Feature Request
description: Propose a new feature or technical task
title: "[Feature] "
labels: ["type: feature"]
body:
  - type: textarea
    id: background
    attributes:
      label: Background & Motivation
      description: Why is this needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is in scope and what is explicitly out of scope
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance Criteria
      placeholder: |
        - [ ] With 100 concurrent booking requests for the same slot, exactly 1 succeeds
        - [ ] Unit and integration tests pass
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Technical Notes
      description: Proposed approach, references, open questions